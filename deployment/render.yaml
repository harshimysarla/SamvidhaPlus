services:
  - type: web
    name: saip-backend
    env: python
    buildCommand: "pip install -r backend/requirements.txt && python backend/seed_database.py"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.2
      - key: DATABASE_URL
        fromDatabase:
          name: saip-postgres
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ACTIVE_DATA_PROVIDER
        value: Demo Data

databases:
  - name: saip-postgres
    databaseName: saip_db
    user: saip_user
    plan: free
